<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedReel Studio</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7F5;--panel:#fff;--ink:#1B2438;--mut:#5D6B82;--line:#EAD7D8;--acc:#C8233A;--acc2:#A11B2E;--ok:#1F7A52;--warn:#9A5B00;--bad:#C8233A;--soft:#FBEFF0;--r:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
header{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.brand{font:700 18px "IBM Plex Sans Condensed",sans-serif}.brand b{color:var(--acc)}
.ptitle{font-weight:600;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9}
header .sp{flex:1}
.btn{border-radius:10px;padding:9px 14px;background:var(--panel);color:var(--ink);cursor:pointer;border:1px solid var(--line);font-weight:600}
.btn:hover{border-color:#d9b9bd}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc2)}
.btn.dark{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.sm{padding:5px 10px;font-size:12px}
main{max-width:1360px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h2{font:700 17px "IBM Plex Sans Condensed",sans-serif;margin:0 0 10px}h3{font-size:12px;margin:14px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.mut{color:var(--mut)}.mini{font-size:12px;color:var(--mut)}.hide{display:none!important}
.studio{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.left{position:sticky;top:70px}
.phone{background:#000;border-radius:26px;padding:9px;box-shadow:0 20px 40px rgba(11,23,48,.18)}
.phone video{width:100%;aspect-ratio:9/16;border-radius:19px;background:#111;display:block}
.seg{display:flex;background:#f3e6e8;border-radius:10px;padding:3px;margin:10px 0}.seg button{flex:1;border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut);font-size:13px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stale{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;background:#1d2433;color:#fff;border-radius:16px;padding:12px 14px 12px 20px;display:flex;gap:16px;align-items:center;box-shadow:0 14px 40px rgba(20,25,40,.35);width:min(620px,calc(100vw - 32px));animation:staleIn .35s ease-out}
.stale b{font-size:16px}.stale .mini{color:#c9d0de}.stale .btn{font-size:16px;padding:12px 20px;white-space:nowrap;animation:pulse 1.8s ease-in-out infinite}
.stale .dot{width:12px;height:12px;border-radius:50%;background:#ffb020;flex:none;box-shadow:0 0 0 4px rgba(255,176,32,.25)}
@keyframes staleIn{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,30,60,.55)}50%{box-shadow:0 0 0 10px rgba(200,30,60,0)}}
.phone{position:relative}.phone .old{position:absolute;left:0;right:0;top:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(15,20,30,.82);color:#fff;text-align:center;padding:20px;border-radius:inherit;z-index:2;font-weight:600}
.phone.isold .old{display:flex}.phone .old .btn{font-size:16px;padding:12px 18px}
body.hasstale .askmsg{margin-top:10px;font-size:14px;border-radius:10px}.askmsg.ok{color:#17663a;background:#e8f7ee;padding:10px 12px}.askmsg.no{color:#8a4b00;background:#fff3d6;padding:10px 12px}
.toast{bottom:104px}body.hasstale main{padding-bottom:110px}
@media(max-width:640px){.stale{flex-wrap:wrap;gap:8px}.stale .btn{width:100%}}
.dl{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.dl a{font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px -16px 14px;padding:0 10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 14px;cursor:pointer;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f4e9ea}.row:last-child{border:0}.row .grow{flex:1;min-width:0}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#f3e6e8;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.badge.silence{background:#eaf4ff;color:#0B66C2}.badge.retake{background:#f3ecff;color:#6b3fd1}.badge.filler{background:#fff4e0;color:#b56b00}.badge.manual{background:#e9f8f1;color:#127a50}
.badge.warn{background:#fff4e0;color:#b56b00}.badge.info{background:#eaf4ff;color:#0B66C2}
.sw{position:relative;width:38px;height:22px;flex:none}.sw input{display:none}.sw span{position:absolute;inset:0;background:#d9c7ca;border-radius:99px;cursor:pointer;transition:.2s}
.sw span:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:var(--acc)}.sw input:checked+span:after{left:19px}
.t{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px;width:46px;flex:none;cursor:pointer}
.claim{background:#fff8ec;border:1px solid #f3dcae;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:600}label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input.in{padding:8px 10px;border:1px solid var(--line);border-radius:9px;width:100%}
details summary{cursor:pointer;font-weight:600;margin:10px 0;color:var(--ink)}
/* credits */
.credits{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.credits b{font-size:15px}.free{background:#e9f8f1;color:#127a50;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}
/* library */
.lib-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.lib-tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.lib-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.lib-tabs small{font-weight:600;opacity:.75;margin-left:4px}
.tiles{display:flex;gap:8px;flex-wrap:wrap;min-height:40px}
.tile{width:86px;border:2px solid transparent;border-radius:12px;background:#fff;cursor:grab;padding:0;overflow:hidden;position:relative;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile img{width:100%;height:110px;object-fit:cover;display:block}.tile .emo{height:110px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(160deg,#16274a,#0b1730);color:#fff}
.tile span{display:block;font-size:10.5px;line-height:1.25;padding:4px 4px 5px;color:var(--ink);height:32px;overflow:hidden}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(200,35,58,.18)}.tile .ai{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;border-radius:6px;padding:1px 5px}
.addtile{width:86px;height:146px;border:2px dashed #d9b9bd;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--mut);font-weight:600;font-size:12px;background:#fff;text-align:center;padding:6px}
.addtile:hover{border-color:var(--acc);color:var(--acc)}
/* timeline */
.tlbar{display:flex;align-items:center;gap:8px;margin:14px 0 6px}.tlbar .grow{flex:1}
.tlwrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding-bottom:6px}
.tl{position:relative;min-width:100%}
.ruler{height:24px;position:relative;border-bottom:1px solid #f1e3e5;cursor:pointer;background:#fffafa}.ruler i{position:absolute;top:0;height:100%;border-left:1px solid #ecd6d9;font-style:normal;font-size:10px;color:var(--mut);padding-left:3px}
.trk{position:relative;border-bottom:1px solid #f6ecee}.trk .lab{position:sticky;left:0;z-index:2;display:inline-block;font-size:10.5px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.92);padding:2px 6px;border-radius:0 0 8px 0;text-transform:uppercase;letter-spacing:.4px}
.trk.script{height:46px}.trk.vis{height:76px;background:repeating-linear-gradient(90deg,#fff,#fff 39px,#fbf3f4 39px,#fbf3f4 40px)}.trk.cards{height:40px}
.trk.vis.drop{background:#fff1f3;outline:2px dashed var(--acc);outline-offset:-3px}
.blk{position:absolute;top:18px;bottom:6px;border-radius:9px;overflow:hidden;cursor:grab;user-select:none;touch-action:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;font-size:11.5px;font-weight:600;color:#fff;background:#24345a;box-shadow:0 2px 6px rgba(11,23,48,.25)}
.blk img{height:calc(100% - 8px);aspect-ratio:9/16;object-fit:cover;border-radius:6px;flex:none;pointer-events:none}
.blk .em{font-size:20px;flex:none;width:24px;text-align:center}.blk .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.blk.photo{background:#2a7a6b}.blk.ai{background:#7a3fd1}.blk.broll{background:#c46a10}.blk.med{background:#C8233A}.blk.icons{background:#4a5a7a;top:16px;bottom:5px}
.blk.off{opacity:.5;top:58px;bottom:2px;z-index:0;font-size:10px;filter:grayscale(.6)}.blk{z-index:1}.blk.sel{outline:3px solid #ffcf3a;outline-offset:-1px}
.blk .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(255,255,255,.18)}.blk .h.l{left:0}.blk .h.r{right:0}
.sen{position:absolute;top:18px;bottom:5px;border-radius:7px;background:#f6eaec;border:1px solid #ecd6d9;font-size:11.5px;padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;color:var(--ink)}
.sen.sel{background:#ffe9b0;border-color:#f0c64b}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);z-index:3;pointer-events:none}.ph:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--acc)}
.insp{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffdfd}
.insp .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.num{display:flex;align-items:center;gap:4px;margin-top:4px}label.f .num input,.num input{display:inline-block;width:70px;margin:0;padding:6px;border:1px solid var(--line);border-radius:8px;text-align:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* words / look */
.words{line-height:2.1}.w{padding:2px 3px;border-radius:5px;cursor:pointer}.w:hover{background:#fbeef0}.w.cut{color:#b9a9ac;text-decoration:line-through}.w.kw{color:var(--acc2);font-weight:600}.w.ed{background:#e9f8f1}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sty{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:#fff;text-align:left}.sty.on{border-color:var(--acc);background:var(--soft)}.sty b{display:block}.sty small{color:var(--mut)}
.ask{display:flex;gap:8px}.ask input{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;cursor:pointer}.chip:hover{border-color:var(--acc)}
.prog{position:fixed;inset:0;background:rgba(11,23,48,.55);display:none;align-items:center;justify-content:center;z-index:9}
.prog .card{width:min(460px,92vw)}.bar{height:8px;background:#f3e6e8;border-radius:99px;overflow:hidden;margin:14px 0 8px}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:10;max-width:90vw}
@media(max-width:980px){.studio{grid-template-columns:1fr}.left{position:static}.phone{max-width:320px;margin:auto}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a class="brand" href="/app#/dashboard" style="color:#fff;text-decoration:none">Med<b>Reel</b></a><span class="ptitle" id="ptitle"></span><div class="sp"></div>
<button class="btn dark sm hide" id="undoBtn">↶ Undo</button><a class="btn dark sm" href="/app#/dashboard" style="text-decoration:none">My videos</a><button class="btn pri sm" id="exportTop">Export video</button></header>

<main id="newView"><p class="mut">Loading your video…</p></main>

<main id="studio" class="hide">
  <div class="studio">
    <div class="left">
            <div class="phone" id="phone"><video id="vid" controls playsinline></video><div class="old"><div>This preview is out of date</div><button class="btn pri" id="updBtn2">▶ Update preview</button></div></div>
      <div class="seg"><button class="on" data-v="preview">Preview</button><button data-v="source">Original</button><button data-v="final">Exported</button></div>
      <button class="btn pri" id="exportBtn" style="width:100%">Approve & export (1080×1920)</button>
      <div class="dl" id="dl"></div>
    </div>
    <div>
      <div class="card">
        <div class="tabs" id="tabs"><button data-t="board" class="on">🎬 Storyboard</button><button data-t="words">💬 Words</button><button data-t="look">🎨 Look</button><button data-t="check">✅ Check</button></div>
        <div id="tab-board"></div><div id="tab-words" class="hide"></div><div id="tab-look" class="hide"></div><div id="tab-check" class="hide"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Ask for a change</h2>
        <div class="ask"><input id="cmd" placeholder="e.g. “Make the subtitles more dynamic”"><button class="btn pri" id="cmdBtn">Apply</button></div>
        <div class="chips" id="chips"></div>
        <div class="askmsg" id="askMsg"></div>
      </div>
    </div>
  </div>
</main>

<div class="prog" id="prog"><div class="card"><h2 id="progT">Editing your video…</h2><div class="bar"><i id="progBar"></i></div><div class="mut" id="progMsg">Starting…</div></div></div>
<div class="toast" id="toast"></div>
<div class="stale hide" id="stale"><span class="dot"></span><div style="flex:1"><b>Your changes aren't in the preview yet</b><div class="mini">Make all your edits, then press the button once to see them.</div></div><button class="btn pri" id="updBtn">▶ Update preview</button></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let META=null, PID=null, P=null, R=null, AI=null, view='preview', CSRF='', STALE=false;
let TAB='board', LIB='photos', PX=26, SELB=null, SELS=null, PICK=null, PHOTOS=[], STOCK=[], STOCKQ='';
let SAMPLE=null;function stopSample(){if(SAMPLE){SAMPLE.pause();SAMPLE=null}const b=$('#mPlay');if(b)b.textContent='▶ Listen'}
const MUS_NAME={calm:'Calm piano',pulse:'Light beat',drive:'Upbeat & energetic',cinematic:'Cinematic & epic'};
const STY_DESC={clean_professional:'Natural colours · calm music · soft motion',modern_educational:'Bright colours · light beat · progress bar',high_energy:'Vivid colours · pop subtitles · strong zooms · upbeat music',cinematic_medical:'Film colours & vignette · slow fades · epic music',minimalist_premium:'Soft colours · minimal subtitles · very little motion'};
const LAYOUT_NAMES={split:'Split screen (visual on top, you below)',pip:'You in a bubble',full_graphic:'Visual only (your voice continues)',side:'Card beside you',labels:'Floating card over you',full:'Just you'};
const MED_EMOJI={coronary:'🩸',heart:'🫀',ct:'🩻',ecg:'📈',bp:'🩺'};
const CHIPS=['Make the subtitles more dynamic','Add English subtitles','Change the background music','Make the video look more professional'];
const BRAND_FIELDS=[['name','Full name'],['specialty','Specialty'],['clinic','Clinic'],['website','Website'],['booking','Booking link'],['phone','Phone'],['primary','Brand colour','color'],['secondary','Background colour','color']];
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4600)};
const api=async(u,o={})=>{o.headers={...(o.headers||{}),'X-CSRF-Token':CSRF};o.credentials='same-origin';const r=await fetch(u,o);
  if(r.status===401){location.href='/app#/login';throw new Error('signed out')}
  const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Something went wrong.');throw new Error(j.error||r.status)}return j};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const fmt=t=>t==null?'–':`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const fmt1=t=>t==null?'–':`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}.${Math.floor(t*10%10)}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR=()=>P&&P.language==='ar';

async function init(){
  const me=await api('/api/auth/me');if(!me.user){location.href='/app#/login';return}CSRF=me.user.csrf;
  META=await api('/api/meta');
  const h=location.hash.slice(1); if(h) openProject(h); else location.href='/app#/dashboard';
}
function showProg(m,p,title){$('#prog').style.display='flex';$('#progMsg').textContent=m;$('#progBar').style.width=(p*100)+'%';if(title)$('#progT').textContent=title}
async function waitJob(title){
  while(true){const s=await api(`/api/projects/${PID}/status`);
    if(s.state==='done'||s.state==='idle'){$('#prog').style.display='none';return s}
    if(s.state==='error'){$('#prog').style.display='none';toast(s.msg);throw new Error(s.msg)}
    showProg(s.msg||'Working…',s.progress||0,title||(s.kind==='final'?'Exporting your video…':s.kind==='generate'?'Editing your video…':s.kind==='animate'?'Animating the illustration…':'Updating the preview…'));
    await new Promise(r=>setTimeout(r,900));}
}
async function openProject(id,keepView){
  PID=id;const r=await api('/api/projects/'+id);
  if(r.status&&['working','queued'].includes(r.status.state)){try{await waitJob()}catch(e){}return openProject(id)}
  if(!r.plan){const why=(r.status&&r.status.state==='error'&&r.status.msg)||'This video could not be made.';
    $('#newView').innerHTML=`<div class="card" style="max-width:560px;margin:40px auto;text-align:center"><h2>This video couldn't be made</h2><p class="mut">${esc(why)}</p>
      <p class="mut">Nothing was charged for it. Delete it and try again — choose the language of the video if you can.</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><a class="btn pri" href="/app#/new" style="text-decoration:none">Make a new video</a><button class="btn" id="delFailed">Delete this one</button></div></div>`;
    $('#delFailed').onclick=async()=>{await api('/api/projects/'+id,{method:'DELETE'});location.href='/app#/dashboard'};return}
  R=r;P=r.plan;AI=r.ai||null;
  $('#newView').classList.add('hide');$('#studio').classList.remove('hide');
  $('#undoBtn').classList.toggle('hide',!r.can_undo);$('#ptitle').textContent=r.title||'';
  renderAll();if(!keepView)setVideo(view);
}
function setVideo(v){view=v;$$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const src=v==='source'?`/media/${PID}/source${P.source.path.slice(P.source.path.lastIndexOf('.'))}`:`/media/${PID}/${v}.mp4`;
  $('#vid').src=src+'?t='+Date.now();}
$$('.seg button').forEach(b=>b.onclick=()=>setVideo(b.dataset.v));
$$('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;$$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));['board','words','look','check'].forEach(t=>$('#tab-'+t).classList.toggle('hide',t!==TAB))});
function setStale(v){STALE=v;$('#stale').classList.toggle('hide',!v);document.body.classList.toggle('hasstale',!!v);$('#phone').classList.toggle('isold',!!v);if(v){try{$('#vid').pause()}catch(e){}}}
const seekOut=t=>{if(view!=='preview')setVideo('preview');const v=$('#vid');const go=()=>{v.currentTime=t};v.readyState>0?go():v.addEventListener('loadedmetadata',go,{once:true})};

/* time mapping (source <-> edited output) */
function keeps(){const d=P.source.duration,c=P.cuts.filter(c=>c.enabled).map(c=>[Math.max(0,c.start),Math.min(d,c.end)]).sort((a,b)=>a[0]-b[0]);const m=[];
  for(const [a,b] of c){if(b<=a)continue;if(m.length&&a<=m[m.length-1][1]+.05)m[m.length-1][1]=Math.max(m[m.length-1][1],b);else m.push([a,b])}
  const k=[];let t=0;for(const [a,b] of m){if(a-t>.12)k.push([t,a]);t=b}if(d-t>.12)k.push([t,d]);return k}
function toOut(t){let o=0;for(const [a,b] of keeps()){if(t<a)return o;if(t<=b)return o+(t-a);o+=b-a}return o}
const DUR=()=>P._out.duration;
function canAI(k){return !!META.ai_images&&(!AI||(AI.left>=AI.cost[k]&&AI.video[k]<AI.per_video[k]))}

function kindOf(s){const g=s.graphic;if(g.asset==='icons')return'icons';if(g.asset==='photo')return g.fill?'ai':'photo';if(g.asset==='broll')return g.animated?'ai':'broll';return'med'}
function nameOf(s){const g=s.graphic,k=kindOf(s);if(k==='icons')return g.label;if(k==='photo')return s.caption||'Your photo';if(k==='ai')return g.animated?'AI animation':'AI illustration';if(k==='broll')return'Stock video';return (META.assets[g.asset+'/'+g.mode]||g.label||'Animation').split(' — ')[0]}
function thumbOf(s){const g=s.graphic;if(g.asset==='gen')return`/media/${PID}/anim_${g.mode}.jpg`;if(g.asset==='photo')return`/media/${PID}/photo_${g.mode}.jpg`;if(g.asset==='broll')return`/media/${PID}/broll_${g.mode}.jpg`;return null}

function tile(kind,id,img,label,isAI,emo){return `<div class="tile ${PICK&&PICK.id===id?'on':''}" draggable="true" data-kind="${kind}" data-id="${esc(id)}" title="${esc(label)}">${img?`<img src="${esc(img)}" alt="" referrerpolicy="no-referrer">`:`<div class="emo">${emo||'🎞'}</div>`}${isAI?'<em class="ai">AI</em>':''}<span>${esc(label)}</span></div>`}

function drawTimeline(){
  const D=DUR(), W=Math.max(D*PX+40,$('#tlwrap').clientWidth-2), tl=$('#tl');tl.style.width=W+'px';
  const step=PX>=40?1:PX>=18?2:PX>=10?5:10;
  let ruler='';for(let t=0;t<=D;t+=step)ruler+=`<i style="left:${t*PX}px">${fmt(t)}</i>`;
  const sents=P.analysis.sentences.map((s,i)=>{const a=toOut(s.start),b=toOut(s.end);if(b-a<0.05)return'';return`<div class="sen ${SELS===i?'sel':''}" data-si="${i}" style="left:${a*PX}px;width:${Math.max(6,(b-a)*PX-2)}px" dir="auto" title="${esc(s.text)}">${esc(s.text)}</div>`}).join('');
  const o=P._out.scenes;
  const blk=s=>{const [a,b]=o[s.id]||[0,0];if(b-a<0.05)return'';const k=kindOf(s),th=thumbOf(s);
    return `<div class="blk ${k} ${s.enabled===false?'off':''} ${SELB===s.id?'sel':''}" data-id="${s.id}" style="left:${a*PX}px;width:${Math.max(14,(b-a)*PX)}px" title="${esc(nameOf(s))} · ${fmt1(a)}–${fmt1(b)}">
      <div class="h l"></div>${th?`<img src="${th}" alt="">`:`<span class="em">${k==='icons'?'🔖':(MED_EMOJI[s.graphic.asset]||'🎞')}</span>`}<span class="tx">${esc(nameOf(s))}</span><div class="h r"></div></div>`};
  const vis=P.scenes.filter(s=>s.layout!=='overlay'&&s.graphic.asset!=='icons'), cards=P.scenes.filter(s=>s.layout==='overlay'||s.graphic.asset==='icons');
  tl.innerHTML=`<div class="ruler" id="ruler">${ruler}</div>
    <div class="trk script"><span class="lab">Script</span>${sents}</div>
    <div class="trk vis" id="tvis"><span class="lab">Visuals</span>${vis.map(blk).join('')}</div>
    <div class="trk cards"><span class="lab">Icon cards</span>${cards.map(blk).join('')}</div><div class="ph" id="playh"></div>`;
  $('#ruler').onclick=e=>seekOut(Math.max(0,(e.clientX-$('#ruler').getBoundingClientRect().left)/PX));
  $$('.sen').forEach(el=>el.onclick=()=>{SELS=+el.dataset.si;SELB=null;const s=P.analysis.sentences[SELS];seekOut(toOut(s.start));drawTimeline();renderInspector()});
  const tv=$('#tvis');
  tv.ondragover=e=>{e.preventDefault();tv.classList.add('drop')};tv.ondragleave=()=>tv.classList.remove('drop');
  tv.ondrop=e=>{e.preventDefault();tv.classList.remove('drop');let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}addAt(d,xToT(e.clientX))};
  tv.onclick=e=>{if(e.target!==tv&&!e.target.classList.contains('lab'))return;if(PICK){addAt(PICK,xToT(e.clientX));PICK=null}else{SELB=null;renderInspector();drawTimeline()}};
  $$('.blk').forEach(bindBlock);
  renderInspector();
}
function xToT(cx){const r=$('#tl').getBoundingClientRect();return Math.max(0,Math.min(DUR()-1,(cx-r.left)/PX))}
function bindBlock(el){
  el.onpointerdown=e=>{e.preventDefault();const id=el.dataset.id,[a0,b0]=P._out.scenes[id];const mode=e.target.classList.contains('l')?'l':e.target.classList.contains('r')?'r':'m';
    const x0=e.clientX;let a=a0,b=b0,moved=false;el.setPointerCapture(e.pointerId);el.style.cursor=mode==='m'?'grabbing':'ew-resize';
    el.onpointermove=ev=>{const dt=(ev.clientX-x0)/PX;if(Math.abs(ev.clientX-x0)>3)moved=true;const D=DUR();
      if(mode==='m'){const len=b0-a0;a=Math.max(0,Math.min(D-len,a0+dt));b=a+len}else if(mode==='l'){a=Math.max(0,Math.min(b0-1,a0+dt))}else{b=Math.min(D,Math.max(a0+1,b0+dt))}
      a=Math.round(a*10)/10;b=Math.round(b*10)/10;el.style.left=a*PX+'px';el.style.width=Math.max(14,(b-a)*PX)+'px'};
    el.onpointerup=async()=>{el.onpointermove=null;el.onpointerup=null;el.style.cursor='';
      if(!moved){SELB=id;SELS=null;seekOut(a0+0.05);drawTimeline();return}
      SELB=id;await ops([{op:'scene_time',id,start_out:a,end_out:b}],{quiet:true})}}
}
async function addAt(d,t){
  const dur=5;
  try{
    if(d.kind==='photo')await ops([{op:'add_photo',photo:d.id,t_out:t,dur}]);
    else if(d.kind==='ai')await ops([{op:'add_photo',photo:d.id,t_out:t,dur,fill:true}]);
    else if(d.kind==='med')await ops([{op:'add_graphic',asset:d.id,t_out:t,dur}]);
    else if(d.kind==='stock'){toast('Downloading the video…');await post(`/api/projects/${PID}/stock`,{video_id:d.id,t_out:t,dur});setStale(true);await openProject(PID,true)}
  }catch(e){}
}
function sentenceAt(t){const ss=P.analysis.sentences;let best=0;ss.forEach((s,i)=>{if(toOut(s.start)<=t+0.05)best=i});return best}

    if($('#sAI'))$('#sAI').onclick=()=>createAI(SELS);
    if($('#sGen'))$('#sGen').onclick=()=>createGen(SELS);
    $('#sPhoto').onclick=()=>{LIB='photos';renderBoard();toast('Tap a photo, then tap the timeline — or drag it there.')};return}

function renderWords(){
  const ar=AR(),cm=P.captions.mode||'original',TR=P.captions.translations||{},hasTr=Object.values(TR).some(v=>(v||'').trim());
  const keep=keeps(),kw=new Set();(P.analysis.terms||[]).forEach(t=>{for(let i=t.start_idx;i<=t.end_idx;i++)kw.add(i)});
  const fromScript=['own_script','teleprompter','ai_voice'].includes(P.mode);
  $('#tab-words').innerHTML=`${ar&&!fromScript?`<div class="claim"><b>Check the Arabic text before exporting.</b> <span class="mini">Fix any line the way you said it — the subtitles follow.</span></div>`:''}
    <div class="grid2" style="margin-bottom:10px">
      <label class="f">Subtitle style<select id="sCap">${META.captions.map(c=>`<option value="${c}" ${c==P.captions.style?'selected':''}>${{minimal:'Minimal',highlight:'Highlighted word',pop:'Big & bold (pop)'}[c]||c}</option>`).join('')}</select></label>
      <label class="f">Subtitle language<select id="sCapLang">${[['original','As spoken'],['translated:en','English'],['translated:fr','French'],['both:en','Spoken + English'],['both:fr','Spoken + French']].map(([v,l])=>`<option value="${v}" ${v===(cm==='original'?'original':cm+':'+(P.captions.target||'en'))?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <h3>Your script ${!hasTr&&P.language!=='en'&&META.ai_scripts?'<button class="btn sm" id="trBtn" style="margin-left:8px;text-transform:none;letter-spacing:0">Show English translation</button>':''}</h3>
    ${P.analysis.sentences.map((x,i)=>`<div class="row" style="align-items:flex-start"><span class="t" onclick="seekOut(${toOut(x.start).toFixed(2)})">${fmt(toOut(x.start))}</span><div class="grow"><input class="in" data-sl="${i}" dir="auto" value="${esc(x.text)}" style="${ar?'font-size:16px;font-family:Tajawal,sans-serif':''}">${hasTr&&TR[i]&&cm==='original'?`<div class="mini" dir="auto">${esc(TR[i])}</div>`:''}${cm!=='original'?`<input class="in" data-tr="${i}" value="${esc(TR[i]||'')}" placeholder="translation" style="margin-top:4px">`:''}</div></div>`).join('')}
    <button class="btn pri sm" id="saveSl" style="margin-top:10px">Save text</button>
    <details><summary>Fix single words</summary><p class="mini">Click a word to correct it. Struck-through words are cut from the video.</p><div class="words" dir="${ar?'rtl':'ltr'}" style="${ar?'font-size:17px;font-family:Tajawal,sans-serif':''}">${P.transcript.map(w=>{const m=(w.start+w.end)/2,cut=!keep.some(([a,b])=>m>=a&&m<=b);return `<span class="w ${cut?'cut':''} ${kw.has(w.i)?'kw':''} ${w.edited?'ed':''}" data-i="${w.i}">${esc(w.text)}</span>`}).join(' ')}</div></details>`;
  $('#sCap').onchange=e=>ops([{op:'set_caption_style',style:e.target.value}]);
  $('#sCapLang').onchange=e=>{const [m,t]=e.target.value.split(':');ops(m==='original'?[{op:'caption_mode',mode:'original'}]:[{op:'translate_captions',target:t},{op:'caption_mode',mode:m,target:t}])};
  if($('#trBtn'))$('#trBtn').onclick=()=>ops([{op:'translate_captions',target:'en'}],{quiet:true});
  $('#saveSl').onclick=()=>{const o=$$('[data-sl]').filter(e=>e.value.trim()!==P.analysis.sentences[+e.dataset.sl].text).map(e=>({op:'edit_sentence',i:+e.dataset.sl,text:e.value.trim()}));
    $$('[data-tr]').forEach(e=>{if(e.value!==(TR[+e.dataset.tr]||''))o.push({op:'set_translation',i:+e.dataset.tr,text:e.value})});if(!o.length)return toast('No changes.');ops(o)};
  $$('.w').forEach(e=>e.onclick=()=>{const i=+e.dataset.i,cur=P.transcript[i].text;const v=prompt('Correct this word (leave empty to hide it from the subtitles):',cur);if(v===null)return;ops(v.trim()?[{op:'edit_word',i,text:v.trim()}]:[{op:'delete_word',i}])});
}

/* ======================= LOOK ======================= */
function renderLook(){
  const b=P.branding,fx=P.effects||{transitions:true,sfx:true};
  $('#tab-look').innerHTML=`<h3 style="margin-top:0">Editing style</h3><div class="styles">${Object.entries(META.styles).map(([k,v])=>`<button class="sty ${k===P.style?'on':''}" data-sty="${k}"><b>${esc(v)}</b><small>${STY_DESC[k]||''}</small></button>`).join('')}</div>
    <h3>Motion & sound</h3>
    <div class="row"><div class="grow"><b>Motion graphics</b><div class="mini">Flash and camera punch when a visual appears, light sweep, animated title bar</div></div><label class="sw"><input type="checkbox" id="fxT" ${fx.transitions!==false?'checked':''}><span></span></label></div>
    <div class="row"><div class="grow"><b>Sound effects</b><div class="mini">Whooshes on scene changes, soft pops on icons and keywords</div></div><label class="sw"><input type="checkbox" id="fxS" ${fx.sfx!==false?'checked':''}><span></span></label></div>
    <div class="grid2" style="margin-top:8px"><label class="f">Background music<span style="display:flex;gap:8px"><select id="sMus" style="flex:1"><option value="off">Off</option>${META.music.map(c=>`<option value="${c}" ${P.music.enabled&&c==P.music.track?'selected':''}>${MUS_NAME[c]||c}</option>`).join('')}</select><button type="button" class="btn sm" id="mPlay">▶ Listen</button></span></label>
      <label class="f">Music volume<select id="sVol">${[[-30,'Very soft'],[-26,'Soft'],[-22,'Normal'],[-18,'Loud']].map(([v,l])=>`<option value="${v}" ${Math.abs((P.music.db??-24)-v)<=2?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f">AI image style<select id="sImg">${[['3d','3D medical'],['flat','Flat illustration'],['photo','Photo-realistic']].map(([v,l])=>`<option value="${v}" ${(b.image_style||'3d')===v?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f" style="grid-column:1/-1">Opening title<input id="sTitle" value="${esc(P.title.text)}"></label></div>
    <button class="btn pri sm" id="saveLook" style="margin-top:10px">Save title</button>
    <details><summary>Name card, colours & end card</summary><div class="grid2">${BRAND_FIELDS.map(([k,l,t])=>`<label class="f">${l}<input data-pb="${k}" type="${t||'text'}" value="${esc(b[k]||'')}"></label>`).join('')}
      <label class="f" style="grid-column:1/-1">Disclaimer on the end card<input data-pb="disclaimer" value="${esc(b.disclaimer||'')}"></label></div><button class="btn sm" id="saveBrand" style="margin-top:10px">Save branding</button></details>
    <details><summary>Delete this video</summary><button class="btn" style="color:var(--bad)" id="delBtn">Delete the recording, renders and edits</button></details>`;
  $$('[data-sty]').forEach(x=>x.onclick=()=>ops([{op:'set_style',style:x.dataset.sty}]));
  $('#fxT').onchange=e=>ops([{op:'set_effects',transitions:e.target.checked}]);
  $('#fxS').onchange=e=>ops([{op:'set_effects',sfx:e.target.checked}]);
  $('#sMus').onchange=e=>{stopSample();ops([{op:'set_music',track:e.target.value}])};
  $('#sVol').onchange=e=>ops([{op:'music_volume',delta_db:+e.target.value-(P.music.db??-24)}]);
  $('#mPlay').onclick=()=>{const t=$('#sMus').value;if(t==='off')return toast('Choose a track first.');if(SAMPLE&&!SAMPLE.paused&&SAMPLE.dataset.t===t){stopSample();return}
    stopSample();SAMPLE=new Audio(`/api/music/${t}`);SAMPLE.dataset.t=t;SAMPLE.play().catch(()=>toast('Could not play the sample.'));$('#mPlay').textContent='■ Stop';SAMPLE.onended=stopSample};
  $('#sImg').onchange=e=>ops([{op:'set_branding',fields:{image_style:e.target.value}}],{quiet:true});
  $('#saveLook').onclick=()=>ops([{op:'set_title',text:$('#sTitle').value}]);
  $('#saveBrand').onclick=()=>{const f={};$$('[data-pb]').forEach(i=>f[i.dataset.pb]=i.value);ops([{op:'set_branding',fields:f}])};
  $('#delBtn').onclick=async()=>{if(!confirm('Permanently delete the original recording, all renders and edits?'))return;const r=await api('/api/projects/'+PID,{method:'DELETE'});toast(r.message);setTimeout(()=>{location.href='/app#/dashboard'},1200)};
}

/* ======================= CHECK ======================= */
function renderCheck(){
  const qa=P.analysis.qa,cuts=P.cuts,nf=cuts.filter(c=>c.reason==='filler'&&!c.enabled).length;
  const nameCut={silence:'Pause removed',retake:'Repeated take removed',filler:'Filler word',manual:'Cut by you'};
  $('#tab-check').innerHTML=`<h3 style="margin-top:0">Medical claims to review</h3>`+(P.analysis.claims.length?P.analysis.claims.map(c=>`<div class="claim"><b dir="auto">“${esc(c.text)}”</b><div class="mini">${esc(c.reason)} — an automatic wording check, not a fact-check. Please confirm it's accurate.</div></div>`).join(''):'<p class="mut">Nothing flagged. ✔</p>')+
    `<h3>What was cut (${P._out.removed}s removed)</h3>${nf?`<div class="claim" style="display:flex;align-items:center;gap:10px"><div class="grow" style="flex:1"><b>${nf} filler word${nf>1?'s':''} found.</b> <span class="mini">Remove them?</span></div><button class="btn sm pri" id="apF">Remove all</button></div>`:''}`+
    cuts.map(c=>`<div class="row"><span class="t" onclick="setVideo('source');setTimeout(()=>{$('#vid').currentTime=${c.start}},300)">${fmt(c.start)}</span><div class="grow"><b>${nameCut[c.reason]||c.reason}</b> <span class="mini">${(c.end-c.start).toFixed(1)}s</span>${c.text?`<div class="mini" dir="auto">“${esc(c.text)}”</div>`:''}</div><label class="sw" title="Cut on/off"><input type="checkbox" ${c.enabled?'checked':''} data-cut="${c.id}"><span></span></label></div>`).join('')+
    `<h3>Recording quality · ${qa.score}/100</h3>`+(qa.issues.map(i=>`<div class="row"><span class="badge ${i.level}">${i.area}</span><div class="grow">${esc(i.msg)}</div></div>`).join('')||'<p class="mut">No issues. ✔</p>');
  if($('#apF'))$('#apF').onclick=()=>ops([{op:'approve_fillers'}]);
  $$('[data-cut]').forEach(x=>x.onchange=()=>ops([{op:'toggle_cut',id:x.dataset.cut,enabled:x.checked}],{quiet:true}));
}

/* ======================= ASK ======================= */
async function cmdRun(text){if(!text.trim())return;const b=$('#cmdBtn');b.disabled=true;const was=b.textContent;b.textContent='Working…';
  let r;try{r=await post(`/api/projects/${PID}/command`,{text})}catch(e){b.disabled=false;b.textContent=was;return}
  b.disabled=false;b.textContent=was;$('#askMsg').textContent=r.message||'';$('#askMsg').className='askmsg '+(r.ok?'ok':'no');
  if(r.ok){$('#cmd').value='';await waitJob('Applying your change…');setStale(false);await openProject(PID);setVideo('preview')}}
$('#cmdBtn').onclick=()=>cmdRun($('#cmd').value);$('#cmd').onkeydown=e=>{if(e.key==='Enter')$('#cmdBtn').click()};
$('#chips').innerHTML=CHIPS.map(c=>`<span class="chip">${c}</span>`).join('');$$('#chips .chip').forEach(c=>c.onclick=()=>{$('#cmd').value=c.textContent;$('#cmd').focus()});
window.addEventListener('beforeunload',e=>{if(STALE){e.preventDefault();e.returnValue=''}});
init();
</script>
