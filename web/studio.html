<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedReel Studio</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7F5;--panel:#fff;--ink:#1B2438;--mut:#5D6B82;--line:#EAD7D8;--acc:#C8233A;--acc2:#A11B2E;--ok:#1F7A52;--warn:#9A5B00;--bad:#C8233A;--r:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--ink);color:#fff}
.brand{font:700 18px "IBM Plex Sans Condensed",sans-serif;letter-spacing:.2px}.brand b{color:var(--acc)}
.pill{padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);font-size:12px}
header .sp{flex:1}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--panel);color:var(--ink);cursor:pointer;border:1px solid var(--line);font-weight:600}
.btn:hover{border-color:#c9d3e2}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc2)}
.btn.dark{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.18)}
.btn:disabled{opacity:.5;cursor:default}.btn.sm{padding:5px 10px;font-size:12px}
main{max-width:1280px;margin:0 auto;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
h1{font:700 30px "IBM Plex Sans Condensed",sans-serif;margin:8px 0 4px}h2{font:700 17px "IBM Plex Sans Condensed",sans-serif;margin:0 0 12px}h3{font-size:13px;margin:16px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.mut{color:var(--mut)}.steps{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.steps span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px}
.steps b{color:var(--acc)}
.drop{border:2px dashed #b9c6da;border-radius:var(--r);padding:34px;text-align:center;background:#fff;cursor:pointer;transition:.2s}
.drop.on,.drop:hover{border-color:var(--acc);background:#f2f8ff}.drop strong{font-size:16px}
.styles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0}
.sty{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff}.sty.on{border-color:var(--acc);background:#f2f8ff}
.sty b{display:block}.sty small{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:600}label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
details summary{cursor:pointer;font-weight:600;margin:6px 0}
.studio{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
.phone{background:#000;border-radius:28px;padding:10px;box-shadow:0 20px 40px rgba(11,23,48,.18);position:sticky;top:16px}
.phone video{width:100%;aspect-ratio:9/16;border-radius:20px;background:#111;display:block}
.seg{display:flex;background:#eef2f8;border-radius:10px;padding:3px;margin:12px 0}.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font:700 22px "IBM Plex Sans Condensed",sans-serif;display:block}.stat small{color:var(--mut)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -18px 14px;padding:0 14px}.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f3f7}.row:last-child{border:0}.row .grow{flex:1;min-width:0}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef2f8;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.badge.silence{background:#eaf4ff;color:#0B66C2}.badge.retake{background:#f3ecff;color:#6b3fd1}.badge.filler{background:#fff4e0;color:#b56b00}.badge.manual{background:#e9f8f1;color:#127a50}
.badge.warn{background:#fff4e0;color:#b56b00}.badge.info{background:#eaf4ff;color:#0B66C2}
.sw{position:relative;width:38px;height:22px;flex:none}.sw input{display:none}.sw span{position:absolute;inset:0;background:#cfd8e6;border-radius:99px;cursor:pointer;transition:.2s}
.sw span:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:var(--acc)}.sw input:checked+span:after{left:19px}
.t{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px;width:52px;flex:none;cursor:pointer}
.words{line-height:2.1}.w{padding:2px 3px;border-radius:5px;cursor:pointer}.w:hover{background:#eef4ff}.w.cut{color:#a9b4c6;text-decoration:line-through}.w.kw{color:var(--acc2);font-weight:600}.w.ed{background:#e9f8f1}.w.del{opacity:.4}
.cmd{display:flex;gap:8px;margin-top:14px}.cmd input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;cursor:pointer}.chip:hover{border-color:var(--acc)}
.log{font-size:13px;margin-top:10px;max-height:120px;overflow:auto}.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.prog{position:fixed;inset:0;background:rgba(11,23,48,.55);display:none;align-items:center;justify-content:center;z-index:9}
.prog .card{width:min(460px,92vw)}.bar{height:8px;background:#eef2f8;border-radius:99px;overflow:hidden;margin:14px 0 8px}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:10;max-width:90vw}
.claim{background:#fff8ec;border:1px solid #f3dcae;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.score{font:700 40px "IBM Plex Sans Condensed",sans-serif}.dl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.dl a{font-size:12px}
.hide{display:none!important}
.mini{font-size:12px;color:var(--mut)}
@media(max-width:900px){.studio{grid-template-columns:1fr}.styles{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.phone{position:static;max-width:360px;margin:auto}}
.phlib{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.ph{padding:0;border:3px solid transparent;border-radius:10px;background:none;cursor:pointer;width:84px;height:84px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;border-radius:7px}.ph.on{border-color:var(--acc)}
.pin{display:flex;gap:8px;align-items:center;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:9px}.pin img{width:46px;height:46px;object-fit:cover;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<header><a class="brand" href="/app#/dashboard" style="color:#fff;text-decoration:none">Med<b>Reel</b></a><span class="pill" id="pill">Studio</span><div class="sp"></div>
<button class="btn dark sm hide" id="undoBtn">↶ Undo</button><a class="btn dark sm" href="/app#/dashboard" style="text-decoration:none">Dashboard</a><button class="btn dark sm" id="newBtn">+ New video</button></header>

<main id="newView"><p class="mut">Loading your video…</p></main>

<main id="studio" class="hide">
  <div class="studio">
    <div>
      <div class="phone"><video id="vid" controls playsinline></video></div>
      <div class="seg"><button class="on" data-v="preview">Edited preview</button><button data-v="source">Original</button><button data-v="final">Final export</button></div>
      <div style="display:flex;gap:8px"><button class="btn pri" id="exportBtn" style="flex:1">Approve & export 1080×1920</button><button class="btn" id="rerenderBtn">Re-render</button></div>
      <div class="dl" id="dl"></div>
    </div>
    <div>
      <div class="stats" id="stats"></div>
      <div class="card">
        <div class="tabs" id="tabs"><button data-t="edits" class="on">AI edits</button><button data-t="gfx">Medical graphics</button><button data-t="photos">Photos & videos</button><button data-t="tx">Transcript</button><button data-t="review">Review</button><button data-t="brand">Style & brand</button></div>
        <div id="tab-edits"></div><div id="tab-gfx" class="hide"></div><div id="tab-photos" class="hide"></div><div id="tab-tx" class="hide"></div><div id="tab-review" class="hide"></div><div id="tab-brand" class="hide"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Ask for a change</h2>
        <div class="cmd"><input id="cmd" placeholder="e.g. “Add a stent animation when I discuss angioplasty”"><button class="btn pri" id="cmdBtn">Apply</button></div>
        <div class="chips" id="chips"></div>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>
</main>

<div class="prog" id="prog"><div class="card"><h2 id="progT">Editing your video…</h2><div class="bar"><i id="progBar"></i></div><div class="mut" id="progMsg">Starting…</div></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let META=null, PID=null, P=null, view='preview', file=null, style='modern_educational';
const STY_DESC={clean_professional:'Calm, credible, subtle motion',modern_educational:'Clear captions, explainer graphics',high_energy:'Bold pop captions, punchy zooms',cinematic_medical:'Film grade, slow pushes',minimalist_premium:'Quiet type, lots of space'};
const BRAND_FIELDS=[['name','Full name'],['specialty','Specialty'],['clinic','Clinic'],['website','Website'],['booking','Booking link'],['phone','Phone'],['primary','Brand colour','color'],['secondary','Background colour','color']];
const CHIPS=['Add English subtitles','Make the subtitles bilingual Arabic and English','Make the subtitles more dynamic','Remove the long pause at 30 seconds','Add an animation of a coronary stent when I discuss angioplasty','Keep my face visible during the heart animation','Change the background music','Make the video look more professional','Remove the sentence about exercise alone','Undo'];
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4200)};
let CSRF='';
const api=async(u,o={})=>{o.headers={...(o.headers||{}),'X-CSRF-Token':CSRF};o.credentials='same-origin';const r=await fetch(u,o);
  if(r.status===401){location.href='/app#/login';throw new Error('signed out')}
  const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Something went wrong.');throw new Error(j.error||r.status)}return j};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const fmt=t=>t==null?'–':`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}.${Math.floor(t*10%10)}`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function init(){
  const me=await api('/api/auth/me');if(!me.user){location.href='/app#/login';return}CSRF=me.user.csrf;
  META=await api('/api/meta');
  const h=location.hash.slice(1); if(h) openProject(h); else location.href='/app#/dashboard';
}
function showProg(m,p,title){$('#prog').style.display='flex';$('#progMsg').textContent=m;$('#progBar').style.width=(p*100)+'%';if(title)$('#progT').textContent=title}
async function waitJob(title){
  while(true){const s=await api(`/api/projects/${PID}/status`);
    if(s.state==='done'||s.state==='idle'){$('#prog').style.display='none';return s}
    if(s.state==='error'){$('#prog').style.display='none';toast('Error: '+s.msg);throw new Error(s.msg)}
    showProg(s.msg||'Working…',s.progress||0,title||(s.kind==='final'?'Exporting final video…':s.kind==='generate'?'Editing your video…':'Updating preview…'));
    await new Promise(r=>setTimeout(r,900));}
}
async function openProject(id){
  PID=id;const r=await api('/api/projects/'+id);
  if(r.status&&['working','queued'].includes(r.status.state)){await waitJob();return openProject(id)}
  if(!r.plan){toast('Project not ready');return}
  P=r.plan;$('#newView').classList.add('hide');$('#studio').classList.remove('hide');$('#newBtn').classList.remove('hide');
  $('#undoBtn').classList.toggle('hide',!r.can_undo);$('#pill').textContent=P.branding.name+' · '+META.styles[P.style];
  renderAll(r);setVideo(view,r);
}
function setVideo(v,r){view=v;$$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const src=v==='source'?`/media/${PID}/source${P.source.path.slice(P.source.path.lastIndexOf('.'))}`:`/media/${PID}/${v}.mp4`;
  $('#vid').src=src+'?t='+Date.now();}
$$('.seg button').forEach(b=>b.onclick=()=>setVideo(b.dataset.v));
$$('#tabs button').forEach(b=>b.onclick=()=>{$$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));['edits','gfx','photos','tx','review','brand'].forEach(t=>$('#tab-'+t).classList.toggle('hide',t!==b.dataset.t))});
const seek=t=>{if(t==null)return;const v=$('#vid');v.currentTime=t;v.play()};

function renderAll(r){
  const o=P._out, cuts=P.cuts, nf=cuts.filter(c=>c.reason==='filler'&&!c.enabled).length;
  $('#stats').innerHTML=`<div class="stat"><b>${fmt(P.source.duration)}</b><small>original</small></div><div class="stat"><b>${fmt(o.duration)}</b><small>edited (−${o.removed}s)</small></div>
  <div class="stat"><b>${P.scenes.filter(s=>s.enabled!==false).length}</b><small>medical graphics</small></div><div class="stat"><b>${P.analysis.qa.score}</b><small>quality · ${esc((P.language||'en').toUpperCase())} · ${esc(P.asr)}</small></div>`;
  // edits
  $('#tab-edits').innerHTML=(nf?`<div class="claim" style="display:flex;align-items:center;gap:10px"><div class="grow"><b>${nf} filler word${nf>1?'s':''} found.</b> <span class="mut">Removing them needs your approval.</span></div><button class="btn sm pri" onclick="ops([{op:'approve_fillers'}])">Approve all</button></div>`:'')+
   cuts.map(c=>`<div class="row"><span class="t" onclick="setVideo('source');setTimeout(()=>seek(${c.start}),300)">${fmt(c.start)}</span><span class="badge ${c.reason}">${c.reason}</span>
   <div class="grow"><div>${esc(c.note||'')}</div>${c.text?`<div class="mini">“${esc(c.text)}”</div>`:''}<div class="mini">${(c.end-c.start).toFixed(2)}s${c.needs_approval&&!c.enabled?' · awaiting approval':''}</div></div>
   <label class="sw"><input type="checkbox" ${c.enabled?'checked':''} onchange="ops([{op:'toggle_cut',id:'${c.id}',enabled:this.checked}])"><span></span></label></div>`).join('');
  // graphics
  const L=META.layouts.map(l=>`<option>${l}</option>`).join('');
  $('#tab-gfx').innerHTML=(P.scenes.length?'':'<p class="mut">No graphics yet.</p>')+P.scenes.map(s=>{const ot=o.scenes[s.id]||[];return `<div class="row"><span class="t" onclick="setVideo('preview');setTimeout(()=>seek(${ot[0]}),300)">${fmt(ot[0])}</span>
    <div class="grow"><b>${esc(s.graphic.asset==='icons'?'Icon card — '+s.graphic.label:s.graphic.asset==='broll'?'Stock video — '+s.graphic.label:s.graphic.asset==='photo'?'Your photo':(META.assets[s.graphic.asset+'/'+s.graphic.mode]||s.graphic.label))}</b><div class="mini">${esc(s.caption||s.text||'')}</div></div>
    ${s.layout==='overlay'?'':`<select onchange="ops([{op:'scene_update',id:'${s.id}',layout:this.value}],true)">${L.replace(`<option>${s.layout}</option>`,`<option selected>${s.layout}</option>`)}</select>`}
    <label class="sw"><input type="checkbox" ${s.enabled!==false?'checked':''} onchange="ops([{op:'scene_update',id:'${s.id}',enabled:this.checked}],true)"><span></span></label></div>`}).join('')+
   `<h3>Add a graphic</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="gA" style="max-width:100%">${Object.entries(META.assets).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input id="gP" placeholder="when I say… (or leave empty: at the current video time)" style="flex:1;min-width:200px;padding:8px;border:1px solid var(--line);border-radius:9px"><button class="btn sm pri" onclick="addGraphic()">Add</button></div>
   <p class="mini">To add your own pictures, open the <b>Photos</b> tab.</p>
   <p class="mini">Layouts: full · side (card beside you) · pip (you in a bubble over the animation) · full_graphic (animation only, your voice continues) · split · labels (floating card).</p>`;
  renderPhotos();
  // transcript
  const keep=keeps(), kw=new Set();(P.analysis.terms||[]).forEach(t=>{for(let i=t.start_idx;i<=t.end_idx;i++)kw.add(i)});
  const ar=P.language==='ar', cm=P.captions.mode||'original', TR=P.captions.translations||{};
  const lines=P.analysis.sentences.map((x,i)=>`<div class="row" style="align-items:flex-start"><span class="t" onclick="setVideo('source');setTimeout(()=>seek(${x.start}),300)">${fmt(x.start)}</span><div class="grow"><input data-sl="${i}" dir="auto" value="${esc(x.text)}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;${ar?'font-size:17px;font-family:Tajawal,Inter,sans-serif':''}"></div></div>`).join('');
  const fromScript=['own_script','teleprompter','ai_voice'].includes(P.mode);
  const txHead=(ar||fromScript)?(fromScript?`<p class="mini">These captions come from your script. Edit any line — timing is redistributed automatically. Click a time to hear that line.</p>`:`<div class="claim"><b>Check the Arabic transcript before exporting.</b> <span class="mini">Speech recognition on Lebanese dialect makes mistakes. Retype any line below the way you said it — timing is redistributed automatically. Click a time to hear that line.</span></div>`)+`${lines}<button class="btn sm pri" id="saveSl" style="margin:8px 0 14px">Save corrections & update preview</button><h3>Word view</h3>`:'';
  $('#tab-tx').innerHTML=txHead+`<p class="mini">Click a word to correct it (fixes the subtitles). Struck-through words are cut from the video.${ar?' Words with a dotted underline were auto-corrected medical terms — hover to see what the speech model heard.':''}</p><div class="words" dir="${ar?'rtl':'ltr'}" style="${ar?'font-size:17px;font-family:Tajawal,Inter,sans-serif':''}">`+P.transcript.map(w=>{const m=(w.start+w.end)/2,cut=!keep.some(([a,b])=>m>=a&&m<=b);
    return `<span class="w ${cut?'cut':''} ${kw.has(w.i)?'kw':''} ${w.edited?'ed':''} ${w.deleted?'del':''}" data-i="${w.i}" title="${fmt(w.start)}${w.asr?' · heard: '+esc(w.asr):''}" style="${w.asr?'text-decoration:underline dotted':''}">${esc(w.text)}</span>`}).join(' ')+'</div>'+
    (cm!=='original'?`<h3>Subtitle translation (${esc(P.captions.target||'en')})</h3><p class="mini">Edit any line — your wording is used in the video.</p>`+P.analysis.sentences.map((x,i)=>`<div class="row" style="align-items:flex-start"><div class="grow"><div dir="auto" class="mini">${esc(x.text)}</div><input data-tr="${i}" value="${esc(TR[i]||'')}" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;margin-top:4px"></div></div>`).join('')+'<button class="btn sm pri" id="saveTr" style="margin-top:8px">Save translations & update preview</button>':'');
  if($('#saveSl'))$('#saveSl').onclick=()=>{const o=$$('[data-sl]').filter(e=>e.value.trim()!==P.analysis.sentences[+e.dataset.sl].text).map(e=>({op:'edit_sentence',i:+e.dataset.sl,text:e.value.trim()}));if(!o.length)return toast('No changes.');ops(o,true)};
  if($('#saveTr'))$('#saveTr').onclick=()=>ops($$('[data-tr]').map(e=>({op:'set_translation',i:+e.dataset.tr,text:e.value})),true);
  $$('.w').forEach(e=>e.onclick=()=>{const i=+e.dataset.i,cur=P.transcript[i].text;const v=prompt('Correct this word (leave empty to hide it from the subtitles):',cur);if(v===null)return;
    ops(v.trim()?[{op:'edit_word',i,text:v.trim()}]:[{op:'delete_word',i}])});
  // review
  const qa=P.analysis.qa;
  $('#tab-review').innerHTML=`<h3 style="margin-top:0">Medical claims to review</h3>`+(P.analysis.claims.length?P.analysis.claims.map(c=>`<div class="claim"><div><b>“${esc(c.text)}”</b></div><div class="mini">Flagged: ${esc(c.reason)} — automated wording check, not a fact-check. Please confirm it's accurate and compliant.</div>
    <div style="margin-top:6px;display:flex;gap:6px"><button class="btn sm" onclick="cmdRun('Remove the sentence about ${esc(c.text.split(' ').slice(0,4).join(' ')).replace(/'/g,'')}')">Remove this sentence</button><button class="btn sm" onclick="this.closest('.claim').style.opacity=.45">Reviewed — keep</button></div></div>`).join(''):'<p class="mut">Nothing flagged.</p>')+
    `<h3>Recording quality · ${qa.score}/100</h3>`+(qa.issues.map(i=>`<div class="row"><span class="badge ${i.level}">${i.area}</span><div class="grow">${esc(i.msg)}</div></div>`).join('')||'<p class="mut">No issues.</p>')+
    `<div class="mini">Audio: speech ${qa.audio.speech_dbfs} dBFS · noise ${qa.audio.noise_floor_dbfs} dBFS · SNR ${qa.audio.snr_db} dB · face found in ${Math.round(qa.face_detect_ratio*100)}% of frames</div>
    <h3>Medical terms detected</h3><div class="chips">${[...new Set((P.analysis.terms||[]).map(t=>t.label))].map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`;
  // brand & style
  const b=P.branding;
  $('#tab-brand').innerHTML=`<div class="grid2"><label class="f">Editing style<select id="sStyle">${Object.entries(META.styles).map(([k,v])=>`<option value="${k}" ${k==P.style?'selected':''}>${v}</option>`).join('')}</select></label>
   <label class="f">Subtitles<select id="sCap">${META.captions.map(c=>`<option ${c==P.captions.style?'selected':''}>${c}</option>`).join('')}</select></label>
   <label class="f">Subtitle language<select id="sCapLang">${[['original','Spoken language'],['translated:en','Translated to English'],['translated:fr','Translated to French'],['both:en','Bilingual — spoken + English'],['both:fr','Bilingual — spoken + French']].map(([v,l])=>`<option value="${v}" ${v===(cm==='original'?'original':cm+':'+(P.captions.target||'en'))?'selected':''}>${l}</option>`).join('')}</select></label>
   <label class="f">Music<select id="sMus"><option value="off">off</option>${META.music.map(c=>`<option ${P.music.enabled&&c==P.music.track?'selected':''}>${c}</option>`).join('')}</select></label>
   <label class="f">Opening title<input id="sTitle" value="${esc(P.title.text)}"></label></div>
   <h3>Branding</h3><div class="grid2">${BRAND_FIELDS.map(([k,l,t])=>`<label class="f">${l}<input data-pb="${k}" type="${t||'text'}" value="${esc(b[k]||'')}"></label>`).join('')}
   <label class="f" style="grid-column:1/-1">Disclaimer on end card<input data-pb="disclaimer" value="${esc(b.disclaimer||'')}"></label></div>
   <div style="margin-top:12px;display:flex;gap:8px"><button class="btn pri" id="saveBrand">Save & update preview</button><button class="btn" style="color:var(--bad)" id="delBtn">Delete project & recording</button></div>`;
  $('#saveBrand').onclick=()=>{const f={};$$('[data-pb]').forEach(i=>f[i.dataset.pb]=i.value);const o=[{op:'set_branding',fields:f}];
    if($('#sStyle').value!==P.style)o.push({op:'set_style',style:$('#sStyle').value});
    o.push({op:'set_caption_style',style:$('#sCap').value});o.push($('#sMus').value==='off'?{op:'set_music',track:'off'}:{op:'set_music',track:$('#sMus').value});
    o.push({op:'set_title',text:$('#sTitle').value});
    const [cmode,tgt]=$('#sCapLang').value.split(':');
    if(cmode==='original')o.push({op:'caption_mode',mode:'original'});else{o.push({op:'translate_captions',target:tgt});o.push({op:'caption_mode',mode:cmode,target:tgt})}
    ops(o,true)};
  $('#delBtn').onclick=async()=>{if(!confirm('Permanently delete the original recording, all renders, transcript and edit plan?'))return;const r=await api('/api/projects/'+PID,{method:'DELETE'});toast(r.message);setTimeout(()=>{location.href='/app#/dashboard'},1200)};
  $('#dl').innerHTML=`${r.renders.final?`<a href="/media/${PID}/final.mp4?dl=1">⬇ Final MP4</a><a href="/media/${PID}/final.srt?dl=1">⬇ Subtitles (.srt)</a>${P.captions.mode&&P.captions.mode!=='original'&&P.captions.mode==='both'?`<a href="/media/${PID}/final.${P.captions.target||'en'}.srt?dl=1">⬇ ${P.captions.target||'en'} subtitles</a>`:''}`:''}${r.renders.preview?`<a href="/media/${PID}/preview.srt?dl=1">⬇ Preview .srt</a>`:''}<a href="/media/${PID}/plan.json?dl=1">⬇ Edit plan (JSON)</a>`;
  $('#log').innerHTML=(P.log||[]).slice().reverse().map(l=>`<div><b>${esc(l.command)}</b> <span class="mini">→ ${esc(l.ops.map(o=>o.op).join(', '))}</span></div>`).join('');
}
function keeps(){const d=P.source.duration,c=P.cuts.filter(c=>c.enabled).map(c=>[Math.max(0,c.start),Math.min(d,c.end)]).sort((a,b)=>a[0]-b[0]);const m=[];
  for(const [a,b] of c){if(b<=a)continue;if(m.length&&a<=m[m.length-1][1]+.05)m[m.length-1][1]=Math.max(m[m.length-1][1],b);else m.push([a,b])}
  const k=[];let t=0;for(const [a,b] of m){if(a-t>.12)k.push([t,a]);t=b}if(d-t>.12)k.push([t,d]);return k}
let PHOTOS=[], SEL=null, SELV=null, STOCK=[], STOCKQ='';
function toOut(t){let o=0;for(const [a,b] of keeps()){if(t<a)return o;if(t<=b)return o+(t-a);o+=b-a}return o}
async function loadPhotos(){try{PHOTOS=(await api(`/api/projects/${PID}/photos`)).photos||[]}catch(e){PHOTOS=[]}}
async function renderPhotos(){
  await loadPhotos();
  if(SEL&&!PHOTOS.includes(SEL))SEL=null;
  const TR=P.captions.translations||{}, hasTr=Object.values(TR).some(v=>(v||'').trim()), ar=P.language==='ar';
  const ps=P.scenes.filter(s=>s.graphic.asset==='photo'||s.graphic.asset==='broll');
  const thumb=s=>s.graphic.asset==='photo'?`/media/${PID}/photo_${s.graphic.mode}.jpg`:`/media/${PID}/broll_${s.graphic.mode}.jpg`;
  const any=SEL||SELV;
  const lib=PHOTOS.map(id=>`<button class="ph ${id===SEL?'on':''}" data-ph="${id}" title="Select this photo"><img src="/media/${PID}/photo_${id}.jpg" alt=""></button>`).join('');
  const rows=P.analysis.sentences.map((x,i)=>{
    const here=ps.filter(s=>s.start+0.15>=x.start&&s.start+0.15<x.end);
    return `<div class="row prow" style="align-items:flex-start">
      <span class="t" onclick="setVideo('preview');setTimeout(()=>seek(${toOut(x.start).toFixed(2)}),300)">${fmt(toOut(x.start))}</span>
      <div class="grow"><div dir="auto" style="${ar?'font-size:16px;font-family:Tajawal,Inter,sans-serif':''}">${esc(x.text)}</div>${hasTr&&TR[i]?`<div class="mini" dir="auto">${esc(TR[i])}</div>`:''}
        ${here.map(s=>`<div class="pin"><img src="${thumb(s)}" alt=""><span class="mini grow">${esc(s.graphic.asset==='broll'?'Stock video':(s.caption||'Photo'))} · ${s.layout}</span><button class="btn sm" onclick="ops([{op:'delete_scene',id:'${s.id}'}],true)">Remove</button></div>`).join('')}</div>
      <button class="btn sm ${any?'pri':''}" ${any?'':'disabled'} onclick="placePhoto(${i})">${SELV?'Add video here':'Add photo here'}</button></div>`}).join('');
  const stock=META.stock?`<h3>Stock videos <span class="mini">— free footage, <a href="https://www.pexels.com" target="_blank" rel="noopener">videos provided by Pexels</a></span></h3>
   <div style="display:flex;gap:8px"><input id="stQ" value="${esc(STOCKQ)}" placeholder="search in English, e.g. inhaler, lungs, jogging" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:9px"><button class="btn sm" id="stGo">Search</button></div>
   <div class="phlib">${STOCK.map(v=>`<button class="ph ${v.id===SELV?'on':''}" data-st="${v.id}" title="${esc((v.user||'')+' · '+(v.duration||'')+'s')}"><img src="${esc(v.image||'')}" alt="" referrerpolicy="no-referrer"></button>`).join('')}</div>`
   :`<p class="mini">Want real footage too? Add a free Pexels key (PEXELS_API_KEY) to unlock stock videos.</p>`;
  $('#tab-photos').innerHTML=`<p class="mini" style="margin-top:0">1. Upload your photos (clinic, team, equipment, a scan you're allowed to share). 2. Click a photo to select it. 3. Press <b>Add photo here</b> next to the sentence where it should appear. Never use a photo that shows a patient without written consent.</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="file" id="phF" accept="image/jpeg,image/png,image/webp" multiple><button class="btn sm pri" id="phUp">Upload</button>
   <input id="phC" placeholder="caption for the next photo you add (optional)" maxlength="80" style="flex:1;min-width:180px;padding:8px;border:1px solid var(--line);border-radius:9px"></div>
   <div class="phlib">${lib||'<span class="mini">No photos yet.</span>'}</div>
   ${stock}
   <div style="display:flex;align-items:center;gap:8px;margin:14px 0 4px"><h3 style="margin:0" class="grow">Your script</h3>${!hasTr&&P.language!=='en'?`<button class="btn sm" id="trBtn">Show English translation</button>`:''}</div>
   ${rows}`;
  $$('[data-ph]').forEach(b=>b.onclick=()=>{SEL=b.dataset.ph===SEL?null:b.dataset.ph;SELV=null;renderPhotos()});
  $$('[data-st]').forEach(b=>b.onclick=()=>{const v=+b.dataset.st;SELV=v===SELV?null:v;SEL=null;renderPhotos()});
  if($('#stGo')){$('#stGo').onclick=searchStock;$('#stQ').onkeydown=e=>{if(e.key==='Enter')searchStock()}}
  $('#phUp').onclick=uploadPhotos;
  if($('#trBtn'))$('#trBtn').onclick=()=>ops([{op:'translate_captions',target:'en'}],false);
}
async function uploadPhotos(){const fs=[...$('#phF').files];if(!fs.length){toast('Choose one or more photos first.');return}
  for(const f of fs){const fd=new FormData();fd.append('photo',f);fd.append('place','0');
    const r=await fetch(`/api/projects/${PID}/photos`,{method:'POST',body:fd,credentials:'same-origin',headers:{'X-CSRF-Token':CSRF}});
    const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Upload failed');return}SEL=j.photo}
  toast(fs.length>1?`${fs.length} photos uploaded — the last one is selected.`:'Photo uploaded and selected — now press “Add photo here” next to a sentence.');renderPhotos()}
async function searchStock(){STOCKQ=$('#stQ').value.trim();if(!STOCKQ)return;const r=await fetch('/api/stock/search?q='+encodeURIComponent(STOCKQ),{credentials:'same-origin'});
  const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Search failed');return}STOCK=j.results||[];SELV=null;if(!STOCK.length)toast('No videos found — try other words.');renderPhotos()}
async function placePhoto(i){
  if(SELV){toast('Downloading the video…');const r=await post(`/api/projects/${PID}/stock`,{video_id:SELV,sentence:i});if(r&&r.message)toast(r.message);SELV=null;await waitJob();await openProject(PID);setVideo('preview');return}
  if(!SEL)return;await ops([{op:'add_photo',photo:SEL,sentence:i,caption:$('#phC').value.trim()}],true)}
function playheadOut(){const v=$('#vid');return view==='preview'||view==='final'?(v.currentTime||0):0}
function addGraphic(){const ph=$('#gP').value.trim();const o={op:'add_graphic',asset:$('#gA').value};if(ph)o.phrase=ph;else o.t_out=playheadOut();ops([o],true)}
async function ops(o,render){const r=await post(`/api/projects/${PID}/ops`,{ops:o,render:!!render});toast(r.message);if(render){await waitJob();}await openProject(PID);if(render)setVideo('preview')}
async function cmdRun(text){if(!text.trim())return;const r=await post(`/api/projects/${PID}/command`,{text});toast(r.message);if(r.ok){await waitJob();await openProject(PID);setVideo('preview')}}
$('#cmdBtn').onclick=()=>{cmdRun($('#cmd').value);$('#cmd').value=''};$('#cmd').onkeydown=e=>{if(e.key==='Enter')$('#cmdBtn').click()};
$('#chips').innerHTML=CHIPS.map(c=>`<span class="chip">${c}</span>`).join('');$$('#chips .chip').forEach(c=>c.onclick=()=>{$('#cmd').value=c.textContent;$('#cmd').focus()});
$('#rerenderBtn').onclick=async()=>{await post(`/api/projects/${PID}/render`,{});await waitJob();await openProject(PID);setVideo('preview')};
$('#exportBtn').onclick=async()=>{await post(`/api/projects/${PID}/render`,{final:true});await waitJob('Exporting final 1080×1920 video…');await openProject(PID);setVideo('final');toast('Final video ready — download below.')};
$('#undoBtn').onclick=async()=>{await post(`/api/projects/${PID}/undo`);await waitJob();await openProject(PID);setVideo('preview');toast('Undone.')};
$('#newBtn').onclick=()=>{location.href='/app#/new'};
init();
</script>
