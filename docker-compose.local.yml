# Run MedReel on your own computer for testing (no domain, no payments).
#   docker compose -f docker-compose.local.yml up --build      ->  http://localhost:8080
# Test mode: choosing a plan activates it instantly without charging; password-reset links show on screen.
services:
  medreel:
    build: .
    image: medreel-local
    ports: [ "8080:8080" ]
    environment:
      MEDREEL_DEV: "1"
      PUBLIC_URL: http://localhost:8080
      DATABASE_URL: sqlite:////data/medreel.db
      WORKER_INLINE: "1"
      # Optional: paste a key from console.anthropic.com to try AI script drafts and translation
      ANTHROPIC_API_KEY: ""
    # one web process with one built-in render worker (keeps memory use reasonable on a laptop)
    command: sh -c "gunicorn -w 1 -k gthread --threads 8 --timeout 600 -b 0.0.0.0:8080 wsgi:app"
    volumes: [ "medreel-local-data:/data" ]
volumes:
  medreel-local-data: {}
