# Run MedReel on your own computer for testing (no domain, no payments).
#   docker compose -f docker-compose.local.yml up --build      ->  http://localhost:8080
# Test mode: choosing a plan activates it instantly without charging; password-reset links show on screen.
services:
  medreel:
    build: .
    image: medreel-local
    ports: [ "8080:8080" ]
    environment:
      MEDREEL_DEV: "1"
      WITH_LARGE: "1"   # also download the large speech model (better offline Arabic) — once, into the models volume
      PUBLIC_URL: http://localhost:8080
      DATABASE_URL: sqlite:////data/medreel.db
      WORKER_INLINE: "1"
      # Optional: AI clean-up of Arabic transcripts, AI script drafts, translation.
      # Create a file named .env next to this file containing:  ANTHROPIC_API_KEY=sk-ant-...
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional, best Arabic/French transcripts (seconds instead of minutes): ELEVENLABS_API_KEY=... in the same .env file
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Optional, free stock footage (pexels.com/api): PEXELS_API_KEY=... in the same .env file
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      # ...or Pixabay (pixabay.com/api/docs): PIXABAY_API_KEY=... in the same .env file
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      # Optional, AI medical illustrations (fal.ai, ~$0.03 each): FAL_KEY=... in the same .env file
      FAL_KEY: ${FAL_KEY:-}
      # How many illustrations each new video animates automatically (~$0.35 each). 0 = only when you press Animate.
      MEDREEL_AI_ANIMATE: ${MEDREEL_AI_ANIMATE:-2}
      # How many medical animations Claude designs for each new video (free, uses the Claude key)
      MEDREEL_GEN_ANIMS: ${MEDREEL_GEN_ANIMS:-2}
    # one web process with one built-in render worker (keeps memory use reasonable on a laptop)
    command: sh -c "gunicorn -w 1 -k gthread --threads 8 --timeout 600 -b 0.0.0.0:8080 wsgi:app"
    volumes: [ "medreel-local-data:/data", "medreel-models:/models" ]   # models kept across updates
volumes:
  medreel-local-data: {}
  medreel-models: {}
